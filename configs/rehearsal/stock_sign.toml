# Rehearsal config for the synthetic "stock_sign" dataset: make synth KIND=stock_sign && QRTC_CONFIG=configs/rehearsal/stock_sign.toml ...
[competition]
name = "rehearsal-stock_sign"
task = "binary"
metric = "accuracy"
id_col = "ID"
target_cols = ["RET"]
date_col = "DATE"
group_col = "STOCK"
submission_cols = []
cv = "auto"
n_splits = 5
seed = 42

[metric_params]


[files]
dir = "data/synthetic/stock_sign"
x_train = "X_train.csv"
y_train = "y_train.csv"
x_test = "X_test.csv"
sample_submission = "sample_submission.csv"
hidden_y_test = "y_test_hidden.csv"
