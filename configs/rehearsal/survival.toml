# Rehearsal config for the synthetic "survival" dataset: make synth KIND=survival && QRTC_CONFIG=configs/rehearsal/survival.toml ...
[competition]
name = "rehearsal-survival"
task = "survival"
metric = "ipcw_cindex"
id_col = "ID"
target_cols = ["OS_YEARS", "OS_STATUS"]
date_col = ""
group_col = "CENTER"
submission_cols = ["risk_score"]
cv = "auto"
n_splits = 5
seed = 42

[metric_params]
tau = 7.0

[files]
dir = "data/synthetic/survival"
x_train = "X_train.csv"
y_train = "y_train.csv"
x_test = "X_test.csv"
sample_submission = "sample_submission.csv"
hidden_y_test = "y_test_hidden.csv"

[upload]                      # rehearsal: a local "platform" with a public/private split
backend = "local"
uploaders = ["*"]             # anyone may rehearse uploading; at the event: ONE name
max_total = 8                 # practise living within a submission budget
reserve_final = 2             # the last 2 slots need `qrtc upload --final`
public_fraction = 0.5
