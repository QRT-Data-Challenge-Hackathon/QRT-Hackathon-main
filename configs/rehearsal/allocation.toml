# Rehearsal config for the synthetic "allocation" dataset: make synth KIND=allocation && QRTC_CONFIG=configs/rehearsal/allocation.toml ...
[competition]
name = "rehearsal-allocation"
task = "binary"
metric = "accuracy"
id_col = "ROW_ID"
target_cols = ["TARGET"]
binarize_target = true   # TARGET is the real return; accuracy on its sign
date_col = "TS"
group_col = "ALLOCATION"
submission_cols = []
cv = "auto"
n_splits = 5
seed = 42

[metric_params]


[files]
dir = "data/synthetic/allocation"
x_train = "X_train.csv"
y_train = "y_train.csv"
x_test = "X_test.csv"
sample_submission = "sample_submission.csv"
hidden_y_test = "y_test_hidden.csv"

[upload]                      # rehearsal: a local "platform" with a public/private split
backend = "local"
uploaders = ["*"]             # anyone may rehearse uploading; at the event: ONE name
max_total = 8                 # practise living within a submission budget
reserve_final = 2             # the last 2 slots need `qrtc upload --final`
public_fraction = 0.5
