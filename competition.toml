# Problem spec: every script, notebook and CLI command reads this file through
# qrtc.config.load_spec(). Point QRTC_CONFIG at another file to swap it, or set QRTC_DATA_DIR
# to reuse a spec on another feature table with the same file names.
#
# task:   binary | multiclass | regression | survival
# metric: accuracy weighted_accuracy balanced_accuracy f1 auc logloss rmse mae r2 zero_mean_r2
#         spearman pearson mean_spearman mean_pearson cindex ipcw_cindex
# cv:     auto | date_blocks | time | group | stratified | kfold   (see src/qrtc/cv.py)

[competition]
name = "qrt-x-eth-hackathon-24-11-2026"
task = "binary"
metric = "weighted_accuracy"
id_col = "ID"
target_cols = ["Close return"]   # cutoff -> close return minus its DATE_ID x COUNTRY mean
date_col = "DATE_ID"          # shuffled day id: test days come later, but the ids interleave
group_col = "STOCK_ID"        # 386 stocks, the same in train and test
weight_col = "abs_target"     # metric weight = |Close return| (bigger moves count more)
binarize_target = true        # only the sign is scored; an exact 0 is always wrong
signed_labels = true          # so submissions hold +1/-1, never 0/1
submission_cols = []
drop_cols = ["DATE_ID"]       # shuffled id: not a feature (still used for the CV groups)
cv = "date_blocks"            # folds of whole days (ids are shuffled, so blocks are random days)
n_splits = 5
embargo = 0
seed = 42

[metric_params]

[files]                       # relative to the repository root
dir = "data/raw/qrt-x-eth-hackathon-24-11-2026"   # `kaggle competitions download`, unzipped
x_train = "prep/x_train.parquet"   # flat baseline features from scripts/prep_last30.py
y_train = "y_train.csv"
x_test = "prep/x_submit.parquet"   # all 219,157 ids: Kaggle scores train ids too
sample_submission = ""
hidden_y_test = ""
