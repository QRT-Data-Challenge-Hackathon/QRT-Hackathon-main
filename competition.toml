# competition.toml — THE single source of truth for the event's problem.
#
# At the event (first 15 min): copy the matching file from configs/rehearsal/ or edit this one,
# point [files] at data/raw/, set id/target/date columns, task and metric, then open ONE PR
# "chore: set competition spec" and merge it fast. Every agent pulls main afterwards.
# Until then it points at the synthetic stock_sign rehearsal (run `make rehearse` first).
#
# task:   binary | multiclass | regression | survival
# metric: accuracy weighted_accuracy balanced_accuracy f1 auc logloss rmse mae r2 zero_mean_r2
#         spearman pearson mean_spearman mean_pearson cindex ipcw_cindex
# cv:     auto | date_blocks | time | group | stratified | kfold   (see src/qrtc/cv.py)

[competition]
name = "rehearsal-stock_sign"
task = "binary"
metric = "accuracy"
id_col = "ID"
target_cols = ["RET"]         # survival: [time_col, event_col]; one-hot multiclass: all columns
date_col = "DATE"             # cross-section / time key ("" if none). Drives CV + per-date ops
group_col = "STOCK"           # entity key ("" if none)
weight_col = ""               # metric weight column, e.g. for weighted_accuracy
submission_cols = []          # output columns if different from target_cols (e.g. ["risk_score"])
drop_cols = []                # never use as features (leaky ids, free-text, ...)
cv = "auto"
n_splits = 5
embargo = 0                   # dates dropped either side of a validation block
seed = 42

[metric_params]               # extra kwargs for the metric, e.g. tau = 7.0 for ipcw_cindex

[files]                       # relative to the main checkout (shared by all worktrees)
dir = "data/synthetic/stock_sign"
x_train = "X_train.csv"
y_train = "y_train.csv"       # "" if the target is inside x_train
x_test = "X_test.csv"
sample_submission = "sample_submission.csv"
hidden_y_test = "y_test_hidden.csv"   # rehearsal only; "" at the event

# [upload] — who may upload, and where. Fill it at the briefing (docs/PLAYBOOK.md §3):
#   backend  local   rehearsal only: scores against hidden_y_test, public/private split
#            browser web form: `qrtc upload` reserves + logs, the uploader agent (Claude in
#                    Chrome, logged in by a human beforehand) uploads the printed file, then
#                    `qrtc upload-confirm <id> --score <public>`
#            kaggle  `kaggle competitions submit` (set competition = "<slug>")
#            http    multipart POST to url; secrets via headers_env = {"Authorization" = "ENV_VAR"}
#   uploaders: AGENT_NAMEs allowed to upload — at the event exactly ONE (the Submitter)
#   max_total / max_per_day: the platform's limits (0 = none); reserve_final: slots that only
#   `--final` uploads may use (set 2 at the event: the two finals)
[upload]
backend = "local"
uploaders = ["*"]
max_total = 8
max_per_day = 0
reserve_final = 2
public_fraction = 0.5
url = ""                      # browser: submission page; http: POST endpoint (https only)
competition = ""              # kaggle: competition slug
