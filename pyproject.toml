[project]
name = "qrtc"
version = "0.1.0"
description = "QRT x ETH Zurich hackathon (24 Nov 2026): predicting late-session idiosyncratic stock returns from 5-minute prices"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "catboost>=1.2",
    "statsmodels>=0.14",
    "optuna>=3.6",
    "lifelines>=0.29",
    "scikit-survival>=0.23",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

[project.scripts]
qrtc = "qrtc.cli:main"

[project.optional-dependencies]
fm = [
    "tabdpt>=1.3",
    "tabicl>=2.2",
    "tabpfn>=10.2",
    "torch>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qrtc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401", "E731", "B905", "I001", "E401"]
"tests/*" = ["B011", "E731"]
